<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>みんなの祝日図鑑 - 有休・お休みアイデア共有</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-amber-50 min-h-screen text-slate-800 font-sans">

    <header class="bg-amber-500 text-white shadow-md p-4 sticky top-0 z-10">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl md:text-2xl font-bold flex items-center gap-2">
                <span>🎉</span> みんなの祝日図鑑
            </h1>
            <span class="text-xs md:text-sm bg-amber-600 px-3 py-1 rounded-full">有休取得推進プロジェクト</span>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 space-y-6">

        <section class="bg-white p-6 rounded-2xl shadow-sm border border-amber-100">
            <h2 class="text-lg font-bold text-amber-700 mb-2">休む理由を「オリジナルの祝日」にしよう！</h2>
            <p class="text-sm text-slate-600 leading-relaxed">
                「平日だけど〇〇だから休む！」という個人的な理由を祝日として投稿し、みんなで祝い合う場所です。
                素敵な祝日を見つけたら「その祝日イイね！」を押して、自分の有休の参考にしましょう！
            </p>
        </section>

        <!-- 投稿フォーム -->
        <section class="bg-white p-6 rounded-2xl shadow-sm border border-amber-200">
            <h3 class="text-md font-bold mb-4 flex items-center gap-2">
                <span>✍️</span> 新しい「祝日」を制定する
            </h3>
            <form id="holidayForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">祝日の名前 <span class="text-red-500">*</span></label>
                    <input type="text" id="titleInput" required placeholder="例：愛車で紅葉ドライブ感謝の日 / 新作映画公開初日記念日" 
                           class="w-full p-3 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-amber-400 focus:outline-none">
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">カテゴリ</label>
                        <select id="categoryInput" class="w-full p-3 border border-slate-300 rounded-lg text-sm bg-white">
                            <option value="ドライブ・おでかけ">🚗 ドライブ・おでかけ</option>
                            <option value="映画・エンタメ">🎬 映画・エンタメ</option>
                            <option value="リフレッシュ・睡眠">♨️ リフレッシュ・睡眠</option>
                            <option value="グルメ・カフェ">☕ グルメ・カフェ</option>
                            <option value="家族・イベント">👨‍👩‍👧 家族・イベント</option>
                            <option value="その他">✨ その他</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">休む理由・過ごし方の詳細（任意）</label>
                        <input type="text" id="reasonInput" placeholder="例：混雑を避けて平日にのんびりドライブに行きます！" 
                               class="w-full p-3 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-amber-400 focus:outline-none">
                    </div>
                </div>
                <div id="errorMessage" class="text-red-500 text-xs font-bold hidden"></div>
                <button type="submit" id="submitBtn" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 rounded-lg text-sm transition shadow-sm">
                    祝日をみんなにシェアする 🎉
                </button>
            </form>
        </section>

        <!-- 祝日一覧 -->
        <section class="space-y-4">
            <h3 class="text-md font-bold text-slate-700 flex items-center justify-between">
                <span>📅 みんなが作った祝日一覧</span>
                <span id="holidayCount" class="text-xs bg-amber-200 text-amber-800 px-2 py-1 rounded-full">0件</span>
            </h3>
            <div id="holidayList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="col-span-full text-center py-12 text-slate-400 text-sm">祝日データを読み込み中...</div>
            </div>
        </section>

    </main>

    <script>
        // ★以下のダブルクォーテーション内をご自身のSupabase情報に書き換えてください★
        const SUPABASE_URL = "https://mcukrfldkrublakqshmf.supabase.co";
        const SUPABASE_KEY = "sb_publishable_eoyKMMNR8yWeXmqeLu8yFQ_aU1k585n";

        let db;
        try {
            db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        } catch(e) {
            console.error('Supabase Init Error', e);
        }

        const holidayForm = document.getElementById('holidayForm');
        const titleInput = document.getElementById('titleInput');
        const reasonInput = document.getElementById('reasonInput');
        const categoryInput = document.getElementById('categoryInput');
        const errorMessage = document.getElementById('errorMessage');
        const holidayList = document.getElementById('holidayList');
        const holidayCount = document.getElementById('holidayCount');

        function getMyPostIds() {
            return JSON.parse(localStorage.getItem('my_holiday_ids') || '[]');
        }

        function saveMyPostId(id) {
            const ids = getMyPostIds();
            ids.push(id);
            localStorage.setItem('my_holiday_ids', JSON.stringify(ids));
        }

        function removeMyPostId(id) {
            const ids = getMyPostIds().filter(itemId => itemId !== id);
            localStorage.setItem('my_holiday_ids', JSON.stringify(ids));
        }

        async function fetchHolidays() {
            if (!db) return;
            const { data, error } = await db
                .from('holidays')
                .select('*')
                .eq('status', 'active')
                .order('id', { ascending: false });

            if (error) {
                console.error(error);
                holidayList.innerHTML = '<div class="col-span-full text-center text-red-500 py-4">データの読み込みに失敗しました</div>';
                return;
            }

            holidayCount.textContent = `${data.length}件`;

            if (data.length === 0) {
                holidayList.innerHTML = '<div class="col-span-full text-center py-12 text-slate-400 text-sm">まだ祝日がありません。最初の祝日を作ってみましょう！</div>';
                return;
            }

            const myIds = getMyPostIds();

            holidayList.innerHTML = data.map(item => {
                const isMyPost = myIds.includes(item.id);
                return `
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-100 flex flex-col justify-between space-y-3 relative hover:shadow-md transition">
                    <div>
                        <div class="flex items-center justify-between text-xs text-slate-400 mb-1">
                            <span class="bg-amber-100 text-amber-800 font-semibold px-2 py-0.5 rounded">${escapeHtml(item.category)}</span>
                            <span>${new Date(item.created_at).toLocaleDateString()}</span>
                        </div>
                        <h4 class="font-bold text-slate-800 text-base leading-snug mb-1">🎉 ${escapeHtml(item.title)}</h4>
                        ${item.reason ? `<p class="text-xs text-slate-600 leading-relaxed">${escapeHtml(item.reason)}</p>` : ''}
                    </div>

                    <div class="flex items-center justify-between pt-2 border-t border-slate-50">
                        <button onclick="likeHoliday(${item.id}, ${item.like_count})" class="flex items-center gap-1 text-xs text-amber-600 font-bold hover:bg-amber-50 px-2 py-1 rounded transition">
                            <span>👍 その祝日イイね！</span>
                            <span class="bg-amber-100 text-amber-700 px-1.5 py-0.5 rounded-full text-[10px]">${item.like_count}</span>
                        </button>
                        
                        <div class="flex items-center gap-2">
                            ${isMyPost ? `
                                <button onclick="deleteMyHoliday(${item.id})" class="text-xs text-red-500 hover:text-red-700 font-bold transition">
                                    🗑️ 削除
                                </button>
                            ` : ''}
                            <button onclick="reportHoliday(${item.id}, ${item.report_count})" class="text-[11px] text-slate-400 hover:text-red-500 transition">
                                通報
                            </button>
                        </div>
                    </div>
                </div>
            `}).join('');
        }

        holidayForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMessage.classList.add('hidden');

            const title = titleInput.value.trim();
            const reason = reasonInput.value.trim();
            const category = categoryInput.value;

            const { data, error } = await db.from('holidays').insert([
                { title, reason, category }
            ]).select();

            if (error) {
                alert('投稿に失敗しました: ' + error.message);
            } else if (data && data[0]) {
                saveMyPostId(data[0].id);
                titleInput.value = '';
                reasonInput.value = '';
                fetchHolidays();
            }
        });

        async function deleteMyHoliday(id) {
            if (!confirm('あなたが投稿したこの祝日を削除してもよろしいですか？')) return;
            const { error } = await db.from('holidays').update({ status: 'deleted' }).eq('id', id);
            if (error) {
                alert('削除に失敗しました: ' + error.message);
            } else {
                removeMyPostId(id);
                fetchHolidays();
            }
        }

        async function likeHoliday(id, currentLikes) {
            if(!db) return;
            await db.from('holidays').update({ like_count: currentLikes + 1 }).eq('id', id);
            fetchHolidays();
        }

        async function reportHoliday(id, currentReports) {
            if(!db) return;
            if(!confirm('この投稿に通報しますか？')) return;
            await db.from('holidays').update({ report_count: currentReports + 1 }).eq('id', id);
            alert('通報を受け付けました');
            fetchHolidays();
        }

        function escapeHtml(str) {
            if(!str) return '';
            return str.replace(/[&< me"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[m]);
        }

        window.addEventListener('DOMContentLoaded', fetchHolidays);
    </script>
</body>
</html>
