<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>みんなの祝日カレンダー</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FullCalendar -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

  <!-- ヘッダー -->
  <header class="bg-indigo-600 text-white shadow-md mb-6">
    <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold tracking-wide">🎉 みんなの祝日カレンダー</h1>
      <button id="openFormBtn" class="bg-amber-400 hover:bg-amber-300 text-slate-900 font-bold px-4 py-2 rounded-lg shadow transition transform active:scale-95">
        ＋ 自分の祝日を登録する
      </button>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="max-w-5xl mx-auto px-4">
    <div class="bg-white p-4 md:p-6 rounded-xl shadow-sm border border-slate-200">
      <div id="calendar"></div>
    </div>
  </main>

  <!-- 投稿モーダル -->
  <div id="formModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 relative">
      <button id="closeFormBtn" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 text-xl font-bold">✕</button>
      
      <!-- フォーム画面 -->
      <div id="modalFormStep">
        <h2 class="text-xl font-bold text-slate-800 mb-4">新しい祝日を作る</h2>
        <form id="holidayForm" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">祝日の日付</label>
            <input type="date" id="holidayDate" required class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">祝日名 <span class="text-xs text-rose-500">(必須)</span></label>
            <input type="text" id="holidayTitle" placeholder="例: 自分を徹底的に甘やかす日" required class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">休む理由・過ごし方</label>
            <textarea id="holidayReason" rows="3" placeholder="例: 朝から好きな映画を見てピザを食べるため。" class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">カテゴリ</label>
            <select id="holidayCategory" class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
              <option value="リフレッシュ">リフレッシュ</option>
              <option value="ご褒美">ご褒美</option>
              <option value="趣味・推し活">趣味・推し活</option>
              <option value="体調管理">体調管理</option>
              <option value="その他" selected>その他</option>
            </select>
          </div>

          <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg shadow transition">
            祝日を制定する！
          </button>
        </form>
      </div>

      <!-- 投稿完了画面 -->
      <div id="modalSuccessStep" class="hidden text-center py-4 space-y-4">
        <div class="text-5xl">🎊</div>
        <h3 class="text-2xl font-bold text-slate-800">祝日の制定が完了しました！</h3>
        <p class="text-slate-600 text-sm">あなたの制定した祝日がカレンダーに追加されました。</p>
        
        <div class="bg-indigo-50 p-4 rounded-xl text-left border border-indigo-100">
          <p id="createdDate" class="text-xs text-indigo-500 font-semibold"></p>
          <p id="createdTitle" class="text-lg font-bold text-indigo-900 mt-1"></p>
          <p id="createdReason" class="text-sm text-slate-600 mt-2 italic"></p>
        </div>

        <div class="pt-2 space-y-2">
          <button id="shareXBtn" class="w-full bg-black hover:bg-slate-800 text-white font-bold py-2.5 rounded-lg shadow flex items-center justify-center gap-2 transition">
            <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
            X（旧Twitter）でシェア
          </button>
          <button id="finishBtn" class="w-full bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-2.5 rounded-lg transition">
            閉じる
          </button>
        </div>
      </div>

    </div>
  </div>

  <!-- 祝日詳細表示モーダル -->
  <div id="detailModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 relative">
      <button id="closeDetailBtn" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 text-xl font-bold">✕</button>

      <div class="space-y-4">
        <div>
          <span id="detailBadge" class="inline-block text-xs font-bold px-2.5 py-1 rounded-full bg-indigo-100 text-indigo-700 mb-2">祝日</span>
          <p id="detailDate" class="text-sm font-semibold text-slate-500"></p>
          <h2 id="detailTitle" class="text-2xl font-bold text-slate-800"></h2>
        </div>

        <div id="detailReasonBox" class="bg-slate-50 p-4 rounded-xl border border-slate-200">
          <p class="text-xs font-semibold text-slate-400 mb-1">休む理由・過ごし方</p>
          <p id="detailReason" class="text-slate-700 whitespace-pre-wrap"></p>
        </div>

        <!-- アクションボタン（みんなの祝日の場合） -->
        <div id="userHolidayActions" class="flex items-center justify-between pt-2">
          <button id="likeBtn" class="flex items-center gap-1.5 bg-rose-50 hover:bg-rose-100 text-rose-600 px-4 py-2 rounded-lg font-bold border border-rose-200 transition">
            ❤️ イイね！ <span id="detailLikes">0</span>
          </button>
          <button id="reportBtn" class="text-xs text-slate-400 hover:text-rose-500 underline">
            通報する
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- JavaScript -->
  <script>
    // Supabase 設定（ご自身のURL・Anon Keyに置き換えてください）
    const SUPABASE_URL = "https://mcukrfldkrublakqshmf.supabase.co";
    const SUPABASE_KEY = "sb_publishable_eoyKMMNR8yWeXmqeLu8yFQ_aU1k585n";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let calendar;
    let currentHolidayData = null; // 現在詳細表示しているデータ
    let ngWords = [];

    // 今日の日付を YYYY-MM-DD 形式で取得
    const getTodayString = () => new Date().toISOString().split('T')[0];

    document.addEventListener('DOMContentLoaded', async () => {
      initCalendar();
      setupDateInputDefault();
      await fetchNgWords();
      await fetchAndRenderHolidays();
    });

    // 日付入力の初期値（今日）設定
    function setupDateInputDefault() {
      document.getElementById('holidayDate').value = getTodayString();
    }

    // NGワード取得
    async function fetchNgWords() {
      const { data } = await supabase.from('ng_words').select('word');
      if (data) {
        ngWords = data.map(item => item.word);
      }
    }

    // NGワードチェック
    function containsNgWord(...texts) {
      const combined = texts.join(' ');
      return ngWords.some(word => combined.includes(word));
    }

    // カレンダー初期化
    function initCalendar() {
      const calendarEl = document.getElementById('calendar');
      calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        locale: 'ja',
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: ''
        },
        buttonText: { today: '今日' },
        events: [],
        eventClick: (info) => {
          showDetailModal(info.event.extendedProps);
        }
      });
      calendar.render();
    }

    // 日本の公的祝日取得 (既存祝日)
    async function fetchPublicHolidays() {
      try {
        const res = await fetch('https://holidays-jp.github.io/api/v1/date.json');
        const data = await res.json();
        return Object.entries(data).map(([date, title]) => ({
          title: `🇯🇵 ${title}`,
          start: date,
          color: '#ef4444', // 赤色
          extendedProps: {
            isPublic: true,
            title: title,
            date: date,
            reason: '国民の祝日（日本の祝日）'
          }
        }));
      } catch (e) {
        console.error('日本の祝日データの取得に失敗しました', e);
        return [];
      }
    }

    // Supabaseからユーザー投稿の祝日取得
    async function fetchUserHolidays() {
      const { data, error } = await supabase
        .from('holidays')
        .select('*')
        .eq('status', 'active');

      if (error) {
        console.error('投稿祝日の取得失敗:', error);
        return [];
      }

      return data.map(item => ({
        title: `🎉 ${item.title}`,
        start: item.holiday_date,
        color: '#4f46e5', // インディゴ色
        extendedProps: {
          isPublic: false,
          id: item.id,
          title: item.title,
          reason: item.reason,
          category: item.category,
          date: item.holiday_date,
          like_count: item.like_count,
          report_count: item.report_count
        }
      }));
    }

    // 両方の祝日を結合してカレンダーに再描画
    async function fetchAndRenderHolidays() {
      const publicEvents = await fetchPublicHolidays();
      const userEvents = await fetchUserHolidays();
      
      calendar.removeAllEvents();
      calendar.addEventSource([...publicEvents, ...userEvents]);
    }

    // --- モーダル制御 ---
    const formModal = document.getElementById('formModal');
    const detailModal = document.getElementById('detailModal');

    document.getElementById('openFormBtn').addEventListener('click', () => {
      document.getElementById('holidayForm').reset();
      setupDateInputDefault();
      document.getElementById('modalFormStep').classList.remove('hidden');
      document.getElementById('modalSuccessStep').classList.add('hidden');
      formModal.classList.remove('hidden');
    });

    document.getElementById('closeFormBtn').addEventListener('click', () => formModal.classList.add('hidden'));
    document.getElementById('closeDetailBtn').addEventListener('click', () => detailModal.classList.add('hidden'));
    document.getElementById('finishBtn').addEventListener('click', () => formModal.classList.add('hidden'));

    // --- 投稿処理 ---
    document.getElementById('holidayForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const holiday_date = document.getElementById('holidayDate').value;
      const title = document.getElementById('holidayTitle').value.trim();
      const reason = document.getElementById('holidayReason').value.trim();
      const category = document.getElementById('holidayCategory').value;

      if (!title) {
        alert('祝日名を入力してください');
        return;
      }

      if (containsNgWord(title, reason)) {
        alert('不適切な単語（NGワード）が含まれているため投稿できません。');
        return;
      }

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = '送信中...';

      // 送信データ（不要なカラムを削除して安全に送信）
      const insertData = {
        holiday_date,
        title,
        reason,
        category
      };

      const { data, error } = await supabase
        .from('holidays')
        .insert([insertData])
        .select();

      submitBtn.disabled = false;
      submitBtn.innerText = '祝日を制定する！';

      if (error) {
        alert(`投稿に失敗しました: ${error.message}`);
        return;
      }

      // 投稿成功後、シェア用に保持
      currentHolidayData = { holiday_date, title, reason };

      // 完了画面のセットアップ
      document.getElementById('createdDate').innerText = holiday_date;
      document.getElementById('createdTitle').innerText = title;
      document.getElementById('createdReason').innerText = reason || '（理由の記述なし）';

      document.getElementById('modalFormStep').classList.add('hidden');
      document.getElementById('modalSuccessStep').classList.remove('hidden');

      // カレンダー再読み込み
      fetchAndRenderHolidays();
    });

    // --- X（Twitter）シェア ---
    document.getElementById('shareXBtn').addEventListener('click', () => {
      if (!currentHolidayData) return;
      const { holiday_date, title, reason } = currentHolidayData;
      const text = `【祝日制定】${holiday_date}を「${title}」に指定しました！\n理由: ${reason || '自分をいたわるため'}\n\n#みんなの祝日 #祝日カレンダー`;
      const url = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`;
      window.open(url, '_blank');
    });

    // --- 詳細ダイアログ表示 ---
    function showDetailModal(props) {
      currentHolidayData = props;

      const badge = document.getElementById('detailBadge');
      const userActions = document.getElementById('userHolidayActions');

      document.getElementById('detailDate').innerText = props.date;
      document.getElementById('detailTitle').innerText = props.title;
      document.getElementById('detailReason').innerText = props.reason || '（理由の記載はありません）';

      if (props.isPublic) {
        badge.innerText = '日本の祝日';
        badge.className = 'inline-block text-xs font-bold px-2.5 py-1 rounded-full bg-rose-100 text-rose-700 mb-2';
        userActions.classList.add('hidden');
      } else {
        badge.innerText = `みんなの祝日 [${props.category || 'その他'}]`;
        badge.className = 'inline-block text-xs font-bold px-2.5 py-1 rounded-full bg-indigo-100 text-indigo-700 mb-2';
        document.getElementById('detailLikes').innerText = props.like_count || 0;
        userActions.classList.remove('hidden');
      }

      detailModal.classList.remove('hidden');
    }

    // --- イイね機能 ---
    document.getElementById('likeBtn').addEventListener('click', async () => {
      if (!currentHolidayData || currentHolidayData.isPublic) return;

      const newLikes = (currentHolidayData.like_count || 0) + 1;
      const { error } = await supabase
        .from('holidays')
        .update({ like_count: newLikes })
        .eq('id', currentHolidayData.id);

      if (!error) {
        currentHolidayData.like_count = newLikes;
        document.getElementById('detailLikes').innerText = newLikes;
        fetchAndRenderHolidays();
      }
    });

    // --- 通報機能 ---
    document.getElementById('reportBtn').addEventListener('click', async () => {
      if (!currentHolidayData || currentHolidayData.isPublic) return;

      if (!confirm('この投稿を通報しますか？（通報が重なると自動非表示になります）')) return;

      const newReports = (currentHolidayData.report_count || 0) + 1;
      const { error } = await supabase
        .from('holidays')
        .update({ report_count: newReports })
        .eq('id', currentHolidayData.id);

      if (!error) {
        alert('通報を受け付けました。');
        detailModal.classList.add('hidden');
        fetchAndRenderHolidays();
      }
    });
  </script>
</body>
</html>
